---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.release_info.outputs.has_release }}
      version: ${{ steps.release_info.outputs.version }}
      tag: ${{ steps.release_info.outputs.tag }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install semantic-release and plugins
        run: |
          npm install -g \
            semantic-release@24.2.0 \
            @semantic-release/git@10.0.1 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/exec@6.0.3 \
            conventional-changelog-conventionalcommits@8.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Generate Swagger docs
        run: |
          ~/go/bin/swag init -g cmd/main.go -o docs

      - name: Run tests
        run: |
          go test -v ./...

      - name: Build application
        run: |
          mkdir -p bin
          go build -v -o bin/alderaan ./cmd/main.go

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Detect released version
        id: release_info
        run: |
          # Fetch tags atualizadas criadas pelo semantic-release
          git fetch --tags --force
          CURRENT_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+' | head -n 1 || true)
          if [ -n "$CURRENT_TAG" ]; then
            CLEAN_VER="${CURRENT_TAG#v}"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
            echo "✅ Nova versão liberada: $CURRENT_TAG ($CLEAN_VER)"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Nenhuma release gerada neste workflow."
          fi

  publish-docker:
    name: Publish Docker Image
    needs: release
    if: needs.release.outputs.has_release == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    with:
      version: ${{ needs.release.outputs.version }}

  publish-helm:
    name: Publish Helm Chart
    needs: [release, publish-docker]
    if: needs.release.outputs.has_release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
